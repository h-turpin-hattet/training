# ============================================================
# GITHUB ACTIONS - quick reference
# ============================================================
# File location: .github/workflows/<name>.yml  (at the REPO ROOT)

name: Example tests            # name shown in the Actions tab

on:                            # when does it run?
  push:
    paths:                     # only if these files changed
      - my-project/**
      - .github/workflows/example-tests.yml   # the workflow itself

jobs:
  lint-and-test:
    runs-on: ubuntu-latest     # the machine
    steps:                     # run in order
      - uses: actions/checkout@v7          # `uses` = ready-made action
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'           # keep the quotes
      - run: python -m pip install pytest flake8   # `run` = command
      - run: python -m flake8 .
        working-directory: my-project      # folder where it runs
      - run: python -m pytest -v
        working-directory: my-project

# Red run: open it, click the failing step, read the log.
# Badge for the README:
# ![Tests](https://github.com/<user>/<repo>/actions/workflows/<file>.yml/badge.svg)

# Pitfalls
# - Workflow not at the repo root in .github/workflows: never runs.
# - Without working-directory: commands run at the repo root.
# - Library imported in the tests but not installed: fails in CI only.
